server:
  port: 8080

spring:
  application:
    name: springboot4-mybatis

  datasource:
    url: jdbc:mysql://${DB_HOST:192.168.1.97}:${DB_PORT:3306}/${DB_NAME:springboot4_mybatis}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000

  mvc:
    problemdetails:
      enabled: true

  jackson:
    default-property-inclusion: non_null

mybatis-plus:
  # XML 映射文件位置。默认值就是 classpath*:/mapper/**/*.xml，这里写出来是为了让人一眼看到
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    # 下划线列名自动映射到驼峰属性（默认已是 true，显式写出来更放心）
    map-underscore-to-camel-case: true
  global-config:
    # 关闭启动横幅，日志干净一点
    banner: false
    db-config:
      # 逻辑删除：标记删除的列值 / 未删除的列值
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    # 打开 Mapper 所在包的 DEBUG，MyBatis 会把真正执行的 SQL 和参数打出来
    com.xncoding.mybatis.mapper: DEBUG

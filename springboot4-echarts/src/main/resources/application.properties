server.port=18290

# 导出管线：venv python + playwright。python 路径从环境变量 ECHARTS_PYTHON 注入
# （Windows 下 setx ECHARTS_PYTHON，Linux 下 export ECHARTS_PYTHON），
# 仓库内脚本固定在 scripts/export_png.py（工作目录为工程根时相对路径即可）
echarts.export.python=${ECHARTS_PYTHON}
echarts.export.script-path=scripts/export_png.py
echarts.export.timeout-seconds=45
echarts.export.max-attempts=2

# 无头浏览器属于重资源调用，日志里保留导出耗时便于排查
logging.level.org.springframework.web=INFO

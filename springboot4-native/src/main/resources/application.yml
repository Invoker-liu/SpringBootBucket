server:
  # 本系列统一端口约定：环境变量优先，默认 18260
  port: ${SERVER_PORT:18260}

spring:
  application:
    name: springboot4-native

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

shop:
  name: xncoding-shop
  vip-discount: 0.88
  bulk-threshold: 9999

logging:
  level:
    root: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level %logger{24} - %msg%n"

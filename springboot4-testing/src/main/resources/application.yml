spring:
  application:
    name: springboot4-testing
  datasource:
    # 本地运行与端到端测试用内存 H2（MySQL 兼容模式）；数据层测试被 @ServiceConnection
    # 切到 Testcontainers 起的真实 MySQL，这里的 url/username/password 届时被覆盖
    url: jdbc:h2:mem:orders;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
  sql:
    init:
      mode: always

server:
  port: ${SERVER_PORT:18210}
